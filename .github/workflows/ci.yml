name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs of the same branch/PR (sessions plan R10).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: lint → unit → build → e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Full 6×2 matrix on the `full-matrix` label; 390/1440 × ar/en otherwise (review F10).
      E2E_FULL_MATRIX: ${{ contains(github.event.pull_request.labels.*.name, 'full-matrix') && '1' || '' }}
    # playwright.config.ts starts the SSR server with NODE_ENV=production, so e2e tests the enforcing CSP (R10).
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint (ng lint + lint-styles + prettier)
        run: npm run lint

      - name: Unit tests (Angular, Vitest)
        run: npm run test:ci

      - name: Server + script tests (Vitest, node)
        run: npm run test:server

      - name: Build (production) + gzip budget + prod artifact check, then e2e build
        run: npm run build:ci

      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: e2e (mock API; the real API runs in e2e-real)
        run: npx playwright test

      - name: Upload Playwright report + screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14

  # W24: the same e2e suite against the real safeer_api (pinned by the SAFEER_API_REF repository variable)
  # on MySQL 8 with its dev seed. `@mock-only` specs are dropped (playwright.config.ts grepInvert).
  # scripts/real-api.mjs boots the API with NODE_ENV=test: every e2e request reaches it from 127.0.0.1
  # through the SSR proxy with parallel workers, so the per-IP @Throttle buckets (applications 5/h,
  # OTP 5/h, contact 3/h, admin login 5/min) can't be met by ordering specs; `test` is the API's own
  # opt-out for exactly this and otherwise behaves like development (dev seed, dev OTP hook).
  e2e-real:
    name: e2e (real API ${{ vars.SAFEER_API_REF || 'v1.0.0-rc1' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: safeer
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      E2E_API_URL: http://127.0.0.1:3900
      # e2e/support/real-db.ts seeds per-role staff and auth tokens in the same MySQL, loading mysql2
      # and argon2 from this checkout (DB_* default to the service above, like scripts/real-api.mjs).
      SAFEER_API_DIR: safeer_api
    steps:
      - uses: actions/checkout@v4

      - name: Check out safeer_api
        uses: actions/checkout@v4
        with:
          repository: lotfi029/safeer_api
          ref: ${{ vars.SAFEER_API_REF || 'v1.0.0-rc1' }}
          path: safeer_api

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            safeer_api/package-lock.json

      - run: npm ci

      - name: Build safeer_api
        working-directory: safeer_api
        run: npm ci && npm run build

      - name: Migrate and boot safeer_api (NODE_ENV=test)
        run: node scripts/real-api.mjs safeer_api --detach

      - run: npm run build:e2e

      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: e2e (real API)
        run: npx playwright test

      - name: Upload Playwright report + API log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-real-api
          path: |
            playwright-report
            test-results
            safeer_api/api.log
          retention-days: 14
